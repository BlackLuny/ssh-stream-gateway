name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Package tested binary
        run: |
          mkdir dist
          cp target/release/ssh-stream-gateway dist/
          git rev-parse HEAD > dist/BUILD.txt
          rustc --version >> dist/BUILD.txt
          uname -sm >> dist/BUILD.txt
          cd dist
          shasum -a 256 ssh-stream-gateway > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-stream-gateway-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
