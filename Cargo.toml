[package]
name = "ssh-stream-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Authenticated HTTPS/HTTP2 streaming gateway to explicitly allowed SSH targets"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "server", "http2"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.9"
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
